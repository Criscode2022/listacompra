# The app loads in a browser on the Lista tab, and each tab opens on its empty state.
# Needs the dev server: npm start
# Run: maestro test .maestro/smoke.yaml
url: http://localhost:4200
name: Smoke - tabs open
tags:
  - smoke
---
- launchApp:
    clearState: true
- assertVisible: "La lista está vacía"
- tapOn: "Despensa"
- assertVisible: "Despensa vacía"
- tapOn: "Urgente"
- assertVisible: "Nada urgente"
# The brand name above the sidebar also reads "Lista": pick the link under "Despensa".
- tapOn:
    text: "Lista"
    below: "Despensa"
- assertVisible: "La lista está vacía"
