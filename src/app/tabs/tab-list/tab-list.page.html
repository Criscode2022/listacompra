<app-header
  title="Lista"
  icon="reader"
  [subtitle]="heroSubtitle()"
  [actionButtonIcon]="'download'"
  actionButtonLabel="Exportar PDF"
  [actionButtonCallback]="exportToPdf.bind(this)"
  primaryLabel="Añadir producto"
  [primaryCallback]="addProduct.bind(this)"
></app-header>

<ion-content [class.is-empty]="!pendingProducts().length">
  <div class="filter-bar" *ngIf="categoryCounts()['all'] > 0 && !dataService.basicMode()">
    <div class="filter-scroll">
      <button
        class="filter-chip"
        [class.active]="selectedFilter() === 'all'"
        (click)="setFilter('all')"
      >
        <ion-icon name="grid-outline"></ion-icon>
        <span>Todo</span>
        <span class="filter-count">{{ categoryCounts()['all'] }}</span>
      </button>
      <ng-container *ngFor="let cat of categories">
        <button
          *ngIf="categoryCounts()[cat.value] > 0"
          class="filter-chip"
          [class.active]="selectedFilter() === cat.value"
          [style.--chip-color]="cat.color"
          (click)="setFilter(cat.value)"
        >
          <ion-icon
            [name]="isAssetIcon(cat.icon) ? undefined : cat.icon"
            [src]="isAssetIcon(cat.icon) ? cat.icon : undefined"
          ></ion-icon>
          <span>{{ cat.label }}</span>
          <span class="filter-count">{{ categoryCounts()[cat.value] }}</span>
        </button>
      </ng-container>
    </div>
  </div>

  <div class="text-filter-bar" *ngIf="tabProducts().length">
    <ion-searchbar
      [value]="textFilter()"
      (ionInput)="updateTextFilter($event)"
      placeholder="Buscar producto..."
      debounce="150"
      show-clear-button="focus"
    ></ion-searchbar>
    <ion-button
      class="desktop-inline-cta"
      fill="outline"
      (click)="exportToPdf()"
    >
      <ion-icon slot="start" name="download-outline"></ion-icon>
      Exportar PDF
    </ion-button>
  </div>

  <ng-container *ngIf="pendingProducts().length; else emptyOrNoMatch">
    <ion-list class="shopping-list" lines="none">
      <ng-container *ngFor="let product of pendingProducts()">
        <ng-container *ngIf="!product.checked">
          <ion-item class="shopping-item" lines="none">
            <div
              *ngIf="!dataService.basicMode()"
              class="category-dot"
              slot="start"
              [style.background]="getCategoryColor(product.category)"
            ></div>
            <ion-label class="product-label">
              <h3 class="product-name">{{ product.name }}</h3>
              <p class="product-meta">
                <span class="quantity-tag"
                  >{{ product.quantity
                  }}<span class="quantity-unit">{{ product.unit }}</span></span
                >
                <ion-icon
                  *ngIf="!dataService.basicMode()"
                  [name]="getCategoryIconName(product.category)"
                  [src]="getCategoryIconSrc(product.category)"
                  class="meta-icon"
                ></ion-icon>
              </p>
            </ion-label>
            <ion-checkbox
              slot="end"
              (ionChange)="dataService.toggleStatus(product.name)"
            >
            </ion-checkbox>
          </ion-item>
        </ng-container>
      </ng-container>
    </ion-list>
  </ng-container>
</ion-content>

<ng-template #emptyOrNoMatch>
  <app-empty-state
    *ngIf="textFilter().trim(); else empty"
    icon="search-outline"
    title="Sin coincidencias"
    [message]="'No hay coincidencias para “' + textFilter() + '”.'"
  ></app-empty-state>
</ng-template>

<ng-template #empty>
  <app-empty-state
    icon="bag-handle-outline"
    title="La lista está vacía"
    message="Añade lo que necesites comprar. También puedes marcar productos desde la despensa."
    ctaLabel="Añadir producto"
    ctaIcon="add"
    (cta)="addProduct()"
  ></app-empty-state>
</ng-template>
