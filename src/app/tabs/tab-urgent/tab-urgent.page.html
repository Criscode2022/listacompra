<app-header
  title="Urgente"
  icon="alert"
  color="danger"
  [subtitle]="heroSubtitle()"
  primaryLabel="Añadir urgente"
  [primaryCallback]="addProduct.bind(this)"
></app-header>

<ion-content [class.is-empty]="!urgentProducts().length">
  <div class="desktop-command-bar" *ngIf="!tabProducts().length">
    <ion-button class="desktop-inline-cta" fill="solid" color="danger" (click)="addProduct()">
      <ion-icon slot="start" name="add"></ion-icon>
      Añadir urgente
    </ion-button>
  </div>
  <div class="filter-bar" *ngIf="categoryCounts()['all'] > 0 && !dataService.basicMode()">
    <div class="filter-scroll">
      <button
        class="filter-chip"
        [class.active]="selectedFilter() === 'all'"
        (click)="setFilter('all')"
      >
        <ion-icon name="grid-outline"></ion-icon>
        <span>Todo</span>
        <span class="filter-count">{{ categoryCounts()['all'] }}</span>
      </button>
      <ng-container *ngFor="let cat of categories">
        <button
          *ngIf="categoryCounts()[cat.value] > 0"
          class="filter-chip"
          [class.active]="selectedFilter() === cat.value"
          [style.--chip-color]="cat.color"
          (click)="setFilter(cat.value)"
        >
          <ion-icon
            [name]="isAssetIcon(cat.icon) ? undefined : cat.icon"
            [src]="isAssetIcon(cat.icon) ? cat.icon : undefined"
          ></ion-icon>
          <span>{{ cat.label }}</span>
          <span class="filter-count">{{ categoryCounts()[cat.value] }}</span>
        </button>
      </ng-container>
    </div>
  </div>

  <div class="text-filter-bar" *ngIf="tabProducts().length">
    <ion-searchbar
      [value]="textFilter()"
      (ionInput)="updateTextFilter($event)"
      placeholder="Buscar producto..."
      debounce="150"
      show-clear-button="focus"
    ></ion-searchbar>
    <ion-button
      class="desktop-inline-cta"
      fill="solid"
      color="danger"
      (click)="addProduct()"
    >
      <ion-icon slot="start" name="add"></ion-icon>
      Añadir urgente
    </ion-button>
  </div>

  <ng-container *ngIf="urgentProducts().length; else emptyOrNoMatch">
    <ion-list class="urgent-list">
      <ng-container *ngFor="let product of urgentProducts()">
        <ion-item class="urgent-item">
          <div
            *ngIf="!dataService.basicMode()"
            class="category-dot"
            slot="start"
            [style.background]="getCategoryColor(product.category)"
          ></div>
          <ion-label class="product-label">
            <h3 class="product-name">{{ product.name }}</h3>
            <p class="product-meta">
              <span class="quantity-tag"
                >{{ product.quantity
                }}<span class="quantity-unit">{{ product.unit }}</span></span
              >
              <ion-icon
                *ngIf="!dataService.basicMode()"
                [name]="getCategoryIconName(product.category)"
                [src]="getCategoryIconSrc(product.category)"
                class="meta-icon"
              ></ion-icon>
            </p>
          </ion-label>
          <ion-checkbox
            slot="end"
            [(ngModel)]="product.checked"
            (ionChange)="handleToggleChange(product.name)"
          >
          </ion-checkbox>
        </ion-item>
      </ng-container>
    </ion-list>
  </ng-container>
</ion-content>

<ion-fab vertical="bottom" horizontal="end" slot="fixed">
  <ion-fab-button color="danger" (click)="addProduct()">
    <ion-icon name="add"></ion-icon>
  </ion-fab-button>
</ion-fab>

<ng-template #emptyOrNoMatch>
  <app-empty-state
    *ngIf="textFilter().trim(); else empty"
    icon="search-outline"
    title="Sin coincidencias"
    [message]="'No hay coincidencias para “' + textFilter() + '”.'"
  ></app-empty-state>
</ng-template>

<ng-template #empty>
  <app-empty-state
    icon="flash-outline"
    title="Nada urgente"
    message="Añade lo que necesites comprar solo una vez."
    ctaLabel="Añadir urgente"
    ctaIcon="add"
    tone="danger"
    (cta)="addProduct()"
  ></app-empty-state>
</ng-template>
