<ion-header [translucent]="true" class="glass-header">
  <ion-toolbar class="glass-toolbar mobile-toolbar" [class.tint-danger]="color === 'danger'">
    <ion-icon
      slot="start"
      class="header-leading-icon ion-margin"
      [name]="icon"
    ></ion-icon>
    <ion-title>{{ title }}</ion-title>
    <ion-button
      [class.invisible]="deleteButtonInvisible"
      slot="end"
      class="header-action"
      fill="clear"
      color="danger"
      (click)="clearStorage()"
      aria-label="Borrar todos"
    >
      <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
    </ion-button>
    <ion-button
      *ngIf="actionButtonIcon"
      slot="end"
      class="header-action"
      fill="clear"
      color="primary"
      (click)="actionButtonCallback?.()"
      [attr.aria-label]="actionButtonLabel || 'Acción'"
    >
      <ion-icon slot="icon-only" [name]="actionButtonIcon"></ion-icon>
    </ion-button>
  </ion-toolbar>

  <ion-toolbar class="glass-toolbar desktop-toolbar" [class.tint-danger]="color === 'danger'">
    <div class="desktop-title-block" slot="start">
      <span class="desktop-kicker">Lista de la compra</span>
      <h1 class="desktop-title">{{ title }}</h1>
      <p class="desktop-subtitle" *ngIf="subtitle">{{ subtitle }}</p>
    </div>
    <div class="desktop-actions" slot="end">
      <button
        *ngIf="!deleteButtonInvisible"
        type="button"
        class="desktop-ghost-btn danger"
        (click)="clearStorage()"
      >
        <ion-icon name="trash-outline"></ion-icon>
        Borrar todos
      </button>
      <button
        *ngIf="actionButtonIcon"
        type="button"
        class="desktop-ghost-btn"
        (click)="actionButtonCallback?.()"
      >
        <ion-icon [name]="actionButtonIcon"></ion-icon>
        {{ actionButtonLabel || 'Acción' }}
      </button>
      <button
        *ngIf="primaryLabel"
        type="button"
        class="desktop-cta-btn"
        [class.danger]="color === 'danger'"
        (click)="primaryCallback?.()"
      >
        <ion-icon name="add"></ion-icon>
        {{ primaryLabel }}
      </button>
    </div>
  </ion-toolbar>
</ion-header>
